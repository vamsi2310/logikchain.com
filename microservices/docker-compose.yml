version: '3.8'

# Common environment for all domain microservices performing independent Firebase syncs
x-microservice-env: &service-env
  NODE_ENV: development
  GCLOUD_PROJECT: logikchain-dev
  FIREBASE_STORAGE_BUCKET: logikchain-dev.appspot.com
  SYNC_INTERVAL_MS: "2000"

services:
  # ─── OPTIONAL CACHE INFRASTRUCTURE ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: logikchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ─── API GATEWAY (SERVING PWA, ANDROID, IOS) ──────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.gateway
    container_name: logikchain-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      ENFORCE_APP_CHECK: "false"
      IDENTITY_SERVICE_URL: http://identity-service:4001
      ORDERS_SERVICE_URL: http://orders-service:4002
      GIGS_SERVICE_URL: http://gigs-service:4003
      PAMPHLET_SERVICE_URL: http://pamphlet-service:4004
      PAYMENTS_SERVICE_URL: http://payments-service:4005
      PAYOUTS_SERVICE_URL: http://payouts-service:4006
      CASH_SERVICE_URL: http://cash-service:4007
      CREDIT_SERVICE_URL: http://credit-service:4008
      FINANCE_SERVICE_URL: http://finance-service:4009
      CONFIG_SERVICE_URL: http://config-service:4010
      GOVERNANCE_SERVICE_URL: http://governance-service:4011
      SOCIAL_CONNECT_SERVICE_URL: http://social-connect-service:4012
    depends_on:
      - identity-service
      - orders-service
      - gigs-service
      - payments-service
      - social-connect-service

  # ─── DOMAIN MICROSERVICES (CONTAINER-LOCAL POSTGRES & FIREBASE SYNC) ─────
  identity-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: identity-service
    container_name: logikchain-identity
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      <<: *service-env
      PORT: 4001
      SERVICE_NAME: identity-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/identity_db
    volumes:
      - identity-pgdata:/var/lib/postgresql/data

  orders-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: orders-service
    container_name: logikchain-orders
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      <<: *service-env
      PORT: 4002
      SERVICE_NAME: orders-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orders_db
    volumes:
      - orders-pgdata:/var/lib/postgresql/data

  gigs-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: gigs-service
    container_name: logikchain-gigs
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      <<: *service-env
      PORT: 4003
      SERVICE_NAME: gigs-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gigs_db
    volumes:
      - gigs-pgdata:/var/lib/postgresql/data

  pamphlet-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: pamphlet-service
    container_name: logikchain-pamphlet
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      <<: *service-env
      PORT: 4004
      SERVICE_NAME: pamphlet-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pamphlet_db
    volumes:
      - pamphlet-pgdata:/var/lib/postgresql/data

  payments-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: payments-service
    container_name: logikchain-payments
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      <<: *service-env
      PORT: 4005
      SERVICE_NAME: payments-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payments_db
      PSP_WEBHOOK_SECRET: dev_secret_key
    volumes:
      - payments-pgdata:/var/lib/postgresql/data

  payouts-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: payouts-service
    container_name: logikchain-payouts
    restart: unless-stopped
    ports:
      - "4006:4006"
    environment:
      <<: *service-env
      PORT: 4006
      SERVICE_NAME: payouts-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payouts_db
    volumes:
      - payouts-pgdata:/var/lib/postgresql/data

  cash-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: cash-service
    container_name: logikchain-cash
    restart: unless-stopped
    ports:
      - "4007:4007"
    environment:
      <<: *service-env
      PORT: 4007
      SERVICE_NAME: cash-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cash_db
    volumes:
      - cash-pgdata:/var/lib/postgresql/data

  credit-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: credit-service
    container_name: logikchain-credit
    restart: unless-stopped
    ports:
      - "4008:4008"
    environment:
      <<: *service-env
      PORT: 4008
      SERVICE_NAME: credit-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/credit_db
    volumes:
      - credit-pgdata:/var/lib/postgresql/data

  finance-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: finance-service
    container_name: logikchain-finance
    restart: unless-stopped
    ports:
      - "4009:4009"
    environment:
      <<: *service-env
      PORT: 4009
      SERVICE_NAME: finance-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/finance_db
    volumes:
      - finance-pgdata:/var/lib/postgresql/data

  config-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: config-service
    container_name: logikchain-config
    restart: unless-stopped
    ports:
      - "4010:4010"
    environment:
      <<: *service-env
      PORT: 4010
      SERVICE_NAME: config-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/config_db
    volumes:
      - config-pgdata:/var/lib/postgresql/data

  governance-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: governance-service
    container_name: logikchain-governance
    restart: unless-stopped
    ports:
      - "4011:4011"
    environment:
      <<: *service-env
      PORT: 4011
      SERVICE_NAME: governance-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/governance_db
    volumes:
      - governance-pgdata:/var/lib/postgresql/data

  social-connect-service:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.service
      args:
        SERVICE_NAME: social-connect-service
    container_name: logikchain-social-connect
    restart: unless-stopped
    ports:
      - "4012:4012"
    environment:
      <<: *service-env
      PORT: 4012
      SERVICE_NAME: social-connect-service
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/social_connect_db
    volumes:
      - social-connect-pgdata:/var/lib/postgresql/data

volumes:
  identity-pgdata:
  orders-pgdata:
  gigs-pgdata:
  pamphlet-pgdata:
  payments-pgdata:
  payouts-pgdata:
  cash-pgdata:
  credit-pgdata:
  finance-pgdata:
  config-pgdata:
  governance-pgdata:
  social-connect-pgdata:
