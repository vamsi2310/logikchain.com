[workspace]
members = [
    "crates/logikchain-common",
    "services/orders-service",
    "services/identity-service",
    "services/gigs-service",
    "services/pamphlet-service",
    "services/payments-service",
    "services/payouts-service",
    "services/cash-service",
    "services/credit-service",
    "services/finance-service",
    "services/config-service",
    "services/governance-service",
    "services/social-connect-service"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Logikchain Engineering"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "uuid", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
