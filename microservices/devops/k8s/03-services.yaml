# Helper template for microservice deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: logikchain-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders
          image: gcr.io/logikchain-prod/orders-service:latest
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@postgres-cluster.logikchain-backend.svc.cluster.local:5432/orders_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logikchain-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: logikchain-backend
spec:
  selector:
    app: orders-service
  ports:
    - port: 4002
      targetPort: 4002
---
