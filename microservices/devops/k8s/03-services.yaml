# ==============================================================================
# All 12 Logikchain Domain Microservices (Rust + Axum + Embedded SQLite WAL)
# State persistence and cross-service sync handled via dedicated firebase-bridge (:4050)
# ==============================================================================

# --- EPIC-01: Identity Service (Rust + Axum + Embedded SQLite WAL :4001) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-service-sqlite-pvc
  namespace: logikchain-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: logikchain-backend
spec:
  replicas: 1 # Single-writer architecture for embedded SQLite WAL database file
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        runtime: rust-axum
    spec:
      containers:
        - name: identity
          image: gcr.io/logikchain-prod/identity-service-rust:latest
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: DATABASE_PATH
              value: "/data/identity.db"
            - name: FIREBASE_BRIDGE_URL
              value: "http://firebase-bridge.logikchain-backend.svc.cluster.local:4050"
            - name: SYNC_INTERVAL_MS
              value: "2000"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: identity-service-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: logikchain-backend
spec:
  selector:
    app: identity-service
  ports:
    - port: 4001
      targetPort: 4001
---
