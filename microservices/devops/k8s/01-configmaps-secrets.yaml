apiVersion: v1
kind: ConfigMap
metadata:
  name: logikchain-config
  namespace: logikchain-backend
data:
  NODE_ENV: "production"
  ENFORCE_APP_CHECK: "true"
  GCLOUD_PROJECT: "logikchain-prod"
  FIREBASE_STORAGE_BUCKET: "logikchain-prod.appspot.com"
  IDENTITY_SERVICE_URL: "http://identity-service.logikchain-backend.svc.cluster.local:4001"
  ORDERS_SERVICE_URL: "http://orders-service.logikchain-backend.svc.cluster.local:4002"
  GIGS_SERVICE_URL: "http://gigs-service.logikchain-backend.svc.cluster.local:4003"
  PAMPHLET_SERVICE_URL: "http://pamphlet-service.logikchain-backend.svc.cluster.local:4004"
  PAYMENTS_SERVICE_URL: "http://payments-service.logikchain-backend.svc.cluster.local:4005"
  PAYOUTS_SERVICE_URL: "http://payouts-service.logikchain-backend.svc.cluster.local:4006"
  CASH_SERVICE_URL: "http://cash-service.logikchain-backend.svc.cluster.local:4007"
  CREDIT_SERVICE_URL: "http://credit-service.logikchain-backend.svc.cluster.local:4008"
  FINANCE_SERVICE_URL: "http://finance-service.logikchain-backend.svc.cluster.local:4009"
  CONFIG_SERVICE_URL: "http://config-service.logikchain-backend.svc.cluster.local:4010"
  GOVERNANCE_SERVICE_URL: "http://governance-service.logikchain-backend.svc.cluster.local:4011"
---
apiVersion: v1
kind: Secret
metadata:
  name: logikchain-secrets
  namespace: logikchain-backend
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
  PSP_WEBHOOK_SECRET: "CHANGE_ME_PSP_SECRET"
