# ==============================================================================
# All 12 Logikchain Domain Microservices (EPIC-01 through EPIC-13)
# ==============================================================================

# --- EPIC-01: Identity Service (:4001) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: logikchain-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: logikchain/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: logikchain-config
          env:
            - name: PORT
              value: "4001"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgrespassword@postgres-service.logikchain-backend.svc.cluster.local:5432/identity_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logikchain-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: logikchain-backend
spec:
  selector:
    app: identity-service
  ports:
    - port: 4001
      targetPort: 4001
---
