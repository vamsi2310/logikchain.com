# --- Firebase Sync Bridge Service (Node.js + Firebase Admin SDK :4050) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firebase-bridge
  namespace: logikchain-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firebase-bridge
  template:
    metadata:
      labels:
        app: firebase-bridge
    spec:
      containers:
        - name: firebase-bridge
          image: logikchain/firebase-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4050
          envFrom:
            - configMapRef:
                name: logikchain-config
          env:
            - name: PORT
              value: "4050"
            - name: ORDERS_SERVICE_URL
              value: "http://orders-service:4002"
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:4001"
            - name: GIGS_SERVICE_URL
              value: "http://gigs-service:4003"
            - name: PAYMENTS_SERVICE_URL
              value: "http://payments-service:4005"
          readinessProbe:
            httpGet:
              path: /health
              port: 4050
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: firebase-bridge
  namespace: logikchain-backend
spec:
  selector:
    app: firebase-bridge
  ports:
    - port: 4050
      targetPort: 4050
---
