apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-engine
  namespace: logikchain-backend
  labels:
    app: sync-engine
spec:
  replicas: 1 # Singleton daemon to avoid duplicate CDC stream processing
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sync-engine
  template:
    metadata:
      labels:
        app: sync-engine
    spec:
      containers:
        - name: syncer
          image: gcr.io/logikchain-prod/sync-engine:latest
          ports:
            - containerPort: 4050
          envFrom:
            - configMapRef:
                name: logikchain-config
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@postgres-cluster.logikchain-backend.svc.cluster.local:5432/sync_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logikchain-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4050
---
apiVersion: v1
kind: Service
metadata:
  name: sync-engine
  namespace: logikchain-backend
spec:
  selector:
    app: sync-engine
  ports:
    - port: 4050
      targetPort: 4050
