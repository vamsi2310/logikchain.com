apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/part-of: logikchain-platform
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/description: "Logikchain Microservice: ${SERVICE_NAME}"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "${MAX_INSTANCES}"
        run.googleapis.com/execution-environment: "gen2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/cloudsql-instances: "${PROJECT_ID}:${REGION}:logikchain-postgres-${ENV}"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: logikchain-backend-sa@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/logikchain-microservices/${SERVICE_NAME}:latest
          ports:
            - name: http1
              containerPort: ${PORT}
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "${ENV}"
            - name: SYNC_INTERVAL_MS
              value: "2000"
            - name: PORT
              value: "${PORT}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${SERVICE_NAME}-db-url
                  key: latest

