steps:
  # 1. Build API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gateway:$COMMIT_SHA', '-f', 'devops/docker/Dockerfile.gateway', '.']
    dir: 'microservices'

  # 2. Build Sync Engine
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/sync-engine:$COMMIT_SHA', '-f', 'devops/docker/Dockerfile.sync-engine', '.']
    dir: 'microservices'

  # 3. Build Core Services
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=orders-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/orders-service:$COMMIT_SHA', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=gigs-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:$COMMIT_SHA', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=payments-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payments-service:$COMMIT_SHA', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gateway:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/sync-engine:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/orders-service:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payments-service:$COMMIT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
