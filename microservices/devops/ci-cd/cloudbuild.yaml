steps:
  # 1. Build API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gateway:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gateway:latest', '-f', 'devops/docker/Dockerfile.gateway', '.']
    dir: 'microservices'

  # 2. Build Sync Engine
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/sync-engine:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/sync-engine:latest', '-f', 'devops/docker/Dockerfile.sync-engine', '.']
    dir: 'microservices'

  # 3. Build All 12 Domain Microservices
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=identity-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/identity-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/identity-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=orders-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/orders-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/orders-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=gigs-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=pamphlet-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/pamphlet-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/pamphlet-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=payments-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payments-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payments-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=payouts-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payouts-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/payouts-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=cash-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/cash-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/cash-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=credit-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/credit-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/credit-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=finance-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/finance-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/finance-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=config-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/config-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/config-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=governance-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/governance-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/governance-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'SERVICE_NAME=social-connect-service', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/social-connect-service:$COMMIT_SHA', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/social-connect-service:latest', '-f', 'devops/docker/Dockerfile.service', '.']
    dir: 'microservices'

