  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/orders-service:latest'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/logikchain-microservices/gigs-service:latest'
