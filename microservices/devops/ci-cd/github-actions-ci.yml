name: Microservices Build & Deploy

on:
  push:
    branches: [main, dev]
    paths:
      - 'microservices/**'
  pull_request:
    branches: [main]
    paths:
      - 'microservices/**'

env:
  GAR_LOCATION: asia-south1
  PROJECT_ID: logikchain-prod
  REPOSITORY: logikchain-microservices

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - sync-engine
          - identity-service
          - orders-service
          - gigs-service
          - pamphlet-service
          - payments-service
          - payouts-service
          - cash-service
          - credit-service
          - finance-service
          - config-service
          - governance-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'microservices/package-lock.json'

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build Docker Container
        run: |
          cd microservices
          if [ "${{ matrix.service }}" = "gateway" ]; then
            docker build -t ${{ matrix.service }}:${{ github.sha }} -f devops/docker/Dockerfile.gateway .
          elif [ "${{ matrix.service }}" = "sync-engine" ]; then
            docker build -t ${{ matrix.service }}:${{ github.sha }} -f devops/docker/Dockerfile.sync-engine .
          else
            docker build -t ${{ matrix.service }}:${{ github.sha }} --build-arg SERVICE_NAME=${{ matrix.service }} -f devops/docker/Dockerfile.service .
          fi

      - name: Push Container to GCP Artifact Registry
        if: github.event_name == 'push'
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} $IMAGE_URI
          docker tag ${{ matrix.service }}:${{ github.sha }} ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest
          docker push --all-tags ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}
