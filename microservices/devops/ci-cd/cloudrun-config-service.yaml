apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: config-service
  labels:
    cloud.googleapis.com/location: asia-south1
    app.kubernetes.io/name: config-service
    app.kubernetes.io/part-of: logikchain-platform
    logikchain.com/epic: epic-10
  annotations:
    run.googleapis.com/ingress: internal # or 'internal-and-cloud-load-balancing'
    run.googleapis.com/description: "Logikchain Epic-10: Master Configuration, Geo-Hierarchy & Subscriptions Service"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: "gen2"
        run.googleapis.com/cpu-throttling: "false"
        # Format: PROJECT_ID:REGION:INSTANCE_NAME
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:asia-south1:logikchain-postgres-dev"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: logikchain-backend-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/logikchain-microservices/config-service:latest
          ports:
            - name: http1
              containerPort: 4010
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: SYNC_INTERVAL_MS
              value: "2000"
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:4001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: config-service-db-url
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-maps-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 4010
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4010
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
