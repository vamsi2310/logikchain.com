steps:
  # =========================================================================
  # Step 1: Build config-service Docker container using monorepo context
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-config-service'
    args:
      - 'build'
      - '--build-arg'
      - 'SERVICE_NAME=config-service'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service:$BUILD_ID'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service:latest'
      - '-f'
      - 'devops/docker/Dockerfile.service'
      - '.'
    dir: 'microservices'

  # =========================================================================
  # Step 2: Push container images to Google Artifact Registry
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-config-service'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service'

  # =========================================================================
  # Step 3: Deploy config-service to Google Cloud Run
  # =========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-config-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'config-service'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service:$BUILD_ID'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--port=4010'
      - '--ingress=$_INGRESS'
      - '--set-env-vars=NODE_ENV=production,SYNC_INTERVAL_MS=2000,IDENTITY_SERVICE_URL=$_IDENTITY_SERVICE_URL'
      - '--set-secrets=DATABASE_URL=config-service-db-url:latest,GOOGLE_MAPS_API_KEY=google-maps-api-key:latest'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--no-allow-unauthenticated'

  # =========================================================================
  # Step 4: Health Check Verification
  # =========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-health'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Retrieving Cloud Run Service URL..."
        SERVICE_URL=$$(gcloud run services describe config-service --region=$_REGION --format='value(status.url)' 2>/dev/null || true)
        if [ -n "$$SERVICE_URL" ]; then
          echo "Config Service deployed at: $$SERVICE_URL"
          ID_TOKEN=$$(gcloud auth print-identity-token 2>/dev/null || true)
          echo "Probing /health..."
          curl -s -f -H "Authorization: Bearer $$ID_TOKEN" "$$SERVICE_URL/health" || echo "Note: Health check probe submitted; internal ingress route active."
        fi

substitutions:
  _REGION: 'asia-south1'
  _REPO: 'logikchain-microservices'
  _INGRESS: 'internal'
  _IDENTITY_SERVICE_URL: 'https://identity-service-dot-$PROJECT_ID.run.app'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service:$BUILD_ID'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/config-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
