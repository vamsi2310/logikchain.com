<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Accent borders -->
  <rect x="40" y="40" width="1000" height="1000" rx="32" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Badge -->
  <rect x="100" y="100" width="340" height="54" rx="27" fill="#16a34a"/>
  <text x="270" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">DIRECT MILL WHOLESALE</text>

  <!-- Heading -->
  <text x="100" y="240" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="900">
    Cut Kirana Sourcing Costs
  </text>
  <text x="100" y="310" fill="#38bdf8" font-family="Arial, sans-serif" font-size="56" font-weight="900">
    By Up To 15%
  </text>

  <!-- Bullets -->
  <text x="100" y="420" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="32" font-weight="600">✔ Doorstep delivery in under 24 hours</text>
  <text x="100" y="490" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="32" font-weight="600">✔ Zero upfront deposits & flexible credit</text>
  <text x="100" y="560" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="32" font-weight="600">✔ Direct WhatsApp & Web ordering</text>

  <!-- Metric Card -->
  <rect x="100" y="640" width="880" height="180" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="140" y="700" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">ENTRY POINT &amp; SIGNUP PORTAL:</text>
  <text x="140" y="750" fill="#4ade80" font-family="Arial, sans-serif" font-size="34" font-weight="bold">logikchain.com/merchants</text>
  <text x="140" y="790" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Also view: /how-it-works • /download</text>

  <!-- CTA Button -->
  <rect x="100" y="870" width="880" height="110" rx="24" fill="url(#btnGrad)"/>
  <text x="540" y="940" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">
    Sign Up Your Store Now ➔
  </text>
